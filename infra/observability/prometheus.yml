# Coldline
# File: infra/observability/prometheus.yml
# Component: Prometheus scrape configuration
# Purpose: Collect bounded API and worker metrics from the local network.
# Interacts With: API and worker metric endpoints
# Sprint/Task: Sprint 1 — Project 1
# Concepts: Metrics collection
# Tools: Prometheus

global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: coldline-api
    static_configs:
      - targets: ["api:8000"]
  - job_name: coldline-worker
    static_configs:
      - targets: ["worker:9100"]
