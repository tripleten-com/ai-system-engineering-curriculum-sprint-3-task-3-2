# Coldline - Task 3.1
# File: compose.yaml
# Component: Local runtime topology
# Purpose: Run the complete Task 3.1 platform with one command.
# Interacts With: API, worker, PostgreSQL/pgvector, Redis, LocalStack S3, Jaeger, Prometheus, Grafana
# Sprint/Task: Sprint 3 - Project 3 / Task 3.1
# Concepts: Service orchestration, readiness, immutable releases, bounded resources
# Tools: Docker Compose

# This file is student-editable in Task 3.1. Three things about the first-party
# services are yours to change, and nothing else: how their images are named,
# how their health checks decide readiness, and what resources they may use.
# Keep the service roster, the published host ports, the profiles, and the
# third-party image digests exactly as supplied; the public checks compare them.

name: coldline-task-3-1

x-coldline-environment: &coldline-environment
  COLDLINE_DATABASE_URL: postgresql://coldline:coldline_local@postgres:5432/coldline
  COLDLINE_REDIS_URL: redis://redis:6379/0
  COLDLINE_OTEL_ENDPOINT: http://jaeger:4317
  # LocalStack development values. They are not secrets and grant nothing
  # outside this Compose network; never replace them with a real credential.
  COLDLINE_S3_ENDPOINT: http://localstack:4566
  COLDLINE_S3_BUCKET: coldline-corpus
  COLDLINE_S3_REGION: us-east-1
  COLDLINE_S3_ACCESS_KEY_ID: localstack-development-key
  COLDLINE_S3_SECRET_ACCESS_KEY: localstack-development-secret

services:
  postgres:
    # pgvector's PostgreSQL 16 image. The dense arm needs the `vector` column
    # type, which the plain postgres image does not provide.
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: coldline
      POSTGRES_USER: coldline
      POSTGRES_PASSWORD: coldline_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldline -d coldline"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [coldline]

  redis:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
    networks: [coldline]

  localstack:
    profiles: ["localstack"]
    image: localstack/localstack:4.9.1@sha256:ef90c3d6d69e36752d0154f9bc21099fc70dfbffc99a0145a6d7d04a721a6124
    environment:
      SERVICES: s3
      DEBUG: "0"
      EAGER_SERVICE_LOADING: "1"
      # Object contents are not persisted between runs on purpose: the
      # initializer re-uploads the supplied corpus artifacts idempotently on
      # every start, so a fresh start and a resumed start agree.
      PERSISTENCE: "0"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:${COLDLINE_LOCALSTACK_HOST_PORT:-4566}:4566"
    networks: [coldline]

  # The three first-party services below build from this repository. Today they
  # have no `image:` name, so every `poe start` rebuilds them and tags the result
  # `latest`: nobody can say which build is running, and there is nothing to roll
  # back to. Step 1 names each image from infra/release/manifest.yaml, using the
  # `COLDLINE_RELEASE_TAG` variable so a rollout is one environment change.
  initializer:
    build:
      context: .
      dockerfile: infra/containers/api.Dockerfile
      args:
        COLDLINE_BUILD_VERSION: ${COLDLINE_RELEASE_TAG:-3.1.0}
    command: ["python", "-m", "api.initialize"]
    environment: *coldline-environment
    # `localstack` is deliberately absent from this list. It belongs to the
    # `localstack` Compose profile, and a default-profile service that depends on
    # a profiled service makes the whole project invalid for any command that
    # does not enable that profile - which broke every plain
    # `docker compose exec` diagnostic. The initializer waits for object storage
    # itself instead, so the ordering holds without the profile-crossing edge.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    networks: [coldline]

  api:
    build:
      context: .
      dockerfile: infra/containers/api.Dockerfile
      args:
        COLDLINE_BUILD_VERSION: ${COLDLINE_RELEASE_TAG:-3.1.0}
    environment: *coldline-environment
    depends_on:
      initializer:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${COLDLINE_API_HOST_PORT:-8000}:8000"
    restart: unless-stopped
    # This probe asks whether the process is alive, not whether it can serve. A
    # rollout gated on it reports healthy the moment the container starts, and
    # `up --wait` returns while the new build is still refusing requests. Step 2
    # decides what the gate should ask, and how long a warm-up it must tolerate.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [coldline]

  worker:
    build:
      context: .
      dockerfile: infra/containers/worker.Dockerfile
      args:
        COLDLINE_BUILD_VERSION: ${COLDLINE_RELEASE_TAG:-3.1.0}
    environment:
      <<: *coldline-environment
      COLDLINE_CONSUMER_NAME: worker-1
      COLDLINE_MAXIMUM_ATTEMPTS: "3"
      COLDLINE_STALE_MESSAGE_MS: "30000"
      COLDLINE_MODEL_LATENCY_MS: "250"
      COLDLINE_METRICS_PORT: "9100"
    depends_on:
      initializer:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "worker.health"]
      interval: 5s
      timeout: 10s
      retries: 12
    networks: [coldline]

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:1.76.0@sha256:ab6f1a1f0fb49ea08bcd19f6b84f6081d0d44b364b6de148e1798eb5816bacac
    user: "0:0" # Badger must initialize its named volume.
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_KEY: /badger/key
      BADGER_DIRECTORY_VALUE: /badger/data
    volumes:
      - jaeger-data:/badger
    ports:
      - "127.0.0.1:${COLDLINE_JAEGER_HOST_PORT:-16686}:16686"
    networks: [coldline]

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.12.0@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${COLDLINE_PROMETHEUS_HOST_PORT:-9090}:9090"
    networks: [coldline]

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.1.1@sha256:7cb8c64c4d57a57e734073f3cc94620adb24a0acb929bd80ba9f14017e3a975b
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infra/observability/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${COLDLINE_GRAFANA_HOST_PORT:-3000}:3000"
    depends_on: [prometheus, jaeger]
    networks: [coldline]

networks:
  coldline:

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  jaeger-data:
